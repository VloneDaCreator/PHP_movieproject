<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог за филми</title>
    <link rel="stylesheet" href="assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap&subset=cyrillic" rel="stylesheet">

</head>

<body>

    <div class="container">
        <h1>
  <img src="assets/images/header.png" style="width: 100%; max-width: 400px;">
</h1>

        <h2>Добави филм</h2>
        <form onsubmit="addMovie(); return false;">
            <label>Заглавие:</label>
            <input type="text" id="title" required>

            <label>Жанр:</label>
            <input type="text" id="genre" required>

            <label>Година:</label>
            <input type="number" id="year" required>

            <label>Описание:</label>
            <textarea id="description" rows="4"></textarea>

            <button type="submit">Добави</button>
        </form>

        <h2>Търсене</h2>
        <form onsubmit="searchMovies(); return false;">
            <label>Заглавие:</label>
            <input type="text" id="search_title">

            <label>Жанр:</label>
            <input type="text" id="search_genre">

            <label>Година:</label>
            <input type="number" id="search_year">

            <button type="submit">Търси</button>
            <button type="button" onclick="loadMovies()" style="background:#555; margin-top:10px;">
                Покажи всички
            </button>
        </form>

        <h2>Списък с филми</h2>
        <table>
            <thead>
                <tr>
                    <th>Заглавие</th>
                    <th>Жанр</th>
                    <th>Година</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="movieList">
            </tbody>
        </table>

    </div>

    <script src="assets/js/script.js"></script>
</body>

</html>
